[score_app]
version = 0.0.1

[source]
# excel 文件名, 路径为 score/data
excel_file = 驾车代码问题-9.03.xlsx

# sheet 名
sheet_name = 简单问题

# excel 数据索引范围行号。0 开始，默认全部。
; excel_answer_range = 1-3

[chat]
# 如果任务中途执行失败，可以配置对应的 mark 继续使用前面已经成功的结果
; mark = 2024-08-14-14-05-52_WYOkQwwKyY

# 要执行的阶段。rag、rerank 或空（默认，全部流程都执行）
; stage = rag

# chat 要输出的结构化字段筛选。默认输出如下字段
; search_res_fields = final_recall,rerank_output,chat

# 并发运行 chat 任务数
; max_concurrent_tasks = 1

# 是否直接使用 excel 中的答案
use_excel_answer = False

# 是否使用 excel 中的子问题拆分
use_excel_sub_querys = False

# answer 我们的模型回答、aone_copilot、tongyi
excel_answer_type = answer

[score]
# 执行 chat 命令后生成的产物 mark
mark = 2024-08-15_14.23.56_bSsrDEzbPN

# 使用缓存（如果 json 中有对应字段的数据，是否直接使用）
use_cache = False

# all、chat、rag、rerank、excel
score_type = all

# 关键词匹配的基准分数。模型评分为 10 分，可以根据实际情况调整关键词基础分
keyword_base_score = 5

# 并发运行评分任务数
max_concurrent_tasks = 1
