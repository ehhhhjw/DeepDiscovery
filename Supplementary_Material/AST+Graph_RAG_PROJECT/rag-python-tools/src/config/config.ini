repo = /xxx/target_bundle

# 如果没有配置的话，会解析 repo 最后一层作为 bundle name
; bundle_name = target_bundle

branch = release/1500

# 获取指定目录下的文件 commit
; folder_path = 

# 获取的 commit 开始时间
start_date = 2024-05-01
; start_date = 2024-08-19

# commit 包含的最大文件数量。大于的 commit 会被过滤
